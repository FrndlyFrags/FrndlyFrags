name: Update stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh SVG
        run: python update_stats.py
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT with read:user)
          # to include private contributions. Falls back to the default token.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "frndlyfrags"
          git config user.email "frndlyfrags@users.noreply.github.com"
          git add frndlyfrags-stats.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats card" && git push)
