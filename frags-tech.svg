<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="Tech stack – FrndlyFrags" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.h1{font-weight:700;font-size:28px;fill:#f2f3f8;font-family:'Space Grotesk',system-ui,sans-serif}
.eyebrow{fill:#ff7b00;font-size:12px;font-weight:700;letter-spacing:2px}
.count{fill:#7d8399;font-size:11px;letter-spacing:1.5px}
.desc{fill:#9aa0b5;font-size:12px}
.t{animation:in .35s both}
.t:hover{transform:translateY(-4px)}
.t text{fill:#e8eaf2;font-size:13px;font-weight:600}
@keyframes in{from{opacity:0}}
@keyframes headphoneFloat{0%,100%{transform:translateY(0) rotate(-3deg);opacity:.4}50%{transform:translateY(-15px) rotate(3deg);opacity:.8}}
.hp{transform-box:fill-box;transform-origin:center;animation:headphoneFloat 6s ease-in-out infinite}
</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".05"/></pattern>
<radialGradient id="fade"><stop offset="55%" stop-color="#fff"/><stop offset="100%" stop-color="#000"/></radialGradient>
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a0a0a"/><stop offset="50%" stop-color="#1a1a1a"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1"><stop offset="0%"><animate attributeName="stop-color" values="#ff3700;#ff7b00;#d92b00;#ff3700" dur="6s" repeatCount="indefinite"/></stop><stop offset="100%"><animate attributeName="stop-color" values="#d92b00;#ff3700;#ff7b00;#d92b00" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="lglow"><stop offset="0%" stop-color="#ff7b00" stop-opacity=".16"/><stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/></linearGradient>
<linearGradient id="nameg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%"><animate attributeName="stop-color" values="#ff3700;#ff7b00;#ff3700" dur="5s" repeatCount="indefinite"/></stop><stop offset="100%"><animate attributeName="stop-color" values="#ff7b00;#ff3700;#ff7b00" dur="5s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="card"><rect width="1280" height="500" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="500" fill="#12141f"/><rect width="1280" height="500" fill="url(#dots)"/>

