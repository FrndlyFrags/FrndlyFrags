.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
.fire{transform-box:fill-box;transform-origin:center;animation:fireFlicker 2.2s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:sparkFlicker 1.8s ease-in-out infinite}
]]></style>
