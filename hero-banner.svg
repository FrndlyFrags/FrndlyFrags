<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="FrndlyFrags hero banner" xmlns:c2pa="http://c2pa.org/manifest">
<title>FrndlyFrags — hero banner</title>
<defs>
<style><![CDATA[text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes xeq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:xeq 1.2s ease-in-out infinite}
@keyframes xblink{50%{opacity:0}}
.cur{animation:xblink 1s steps(1) infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseGlow{0%,100%{opacity:.4}50%{opacity:1}}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#120505"/><stop offset="55%" stop-color="#1f0805"/><stop offset="100%" stop-color="#0e0303"/></linearGradient>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%"><animate attributeName="stop-color" values="#ff3700;#ff7b00;#d92b00;#ff3700" dur="7s" repeatCount="indefinite"/></stop>
<stop offset="55%"><animate attributeName="stop-color" values="#ff5500;#ff8533;#ff3700;#ff5500" dur="7s" repeatCount="indefinite"/></stop>
<stop offset="100%"><animate attributeName="stop-color" values="#d92b00;#ff3700;#ff7b00;#d92b00" dur="7s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="borderg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#ff3700" stop-opacity=".35"/>
<stop offset="50%" stop-color="#ff7b00" stop-opacity ".3"/>
<stop offset="100%" stop-color="#d92b00" stop-opacity=".35"/></linearGradient>
<radialGradient id="orbP"><stop offset="0%" stop-color="#ff3700" stop-opacity=".10"/><stop offset="100%" stop-color="#ff3700" stop-opacity="0"/></radialGradient>
<radialGradient id="orbV"><stop offset="0%" stop-color="#d92b00" stop-opacity=".12"/><stop offset="100%" stop-color="#d92b00" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".07"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r=".6" fill="rgba(192,132,252,.10)"/></pattern>
<clipPath id="xcard"><rect width="860" height="300" rx="16"/></clipPath>
</defs>
<g clip-path="url(#xcard)">
<rect width="860" height="300" fill="url(#bg)"/>
<rect width="860" height="300" fill="url(#dots)"/>
<circle cx="180" cy="80" r="200" fill="url(#orbP)"><animate attributeName="r" values="200;220;200" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="720" cy="240" r="240" fill="url(#orbV)"><animate attributeName="r" values="240;260;240" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="40" r="160" fill="url(#orbB)"><animate attributeName="r" values="160;180;160" dur="5.5s" repeatCount="indefinite"/></circle>
<rect x="1" y="1" width="858" height="298" rx="15" fill="none" stroke="url(#borderg)" stroke-width="1.5"/>

<!-- Terminal prompt -->
<text x="40" y="48" font-size="13" fill="#8b949e" letter-spacing=".5">$ whoami</text>

<!-- Name with animated gradient -->
<text x="40" y="100" font-size="46" font-weight="800" fill="url(#nameg)" letter-spacing="1.5" filter="url(#glow)">FRNDLYFRAGS</text>

<!-- Title -->
<text x="42" y="126" font-size="13" font-weight="700" fill="#e879f9" letter-spacing="2.5">FULL-STACK DEV · CODER</text>

<!-- Activity lines -->
<text x="40" y="162" font-size="12" fill="#d4d4d8"><tspan fill="#ff7b00">></tspan> <tspan fill="#8b949e">building</tspan> portfolio site</text>
<text x="40" y="184" font-size="12" fill="#d4d4d8"><tspan fill="#ff7b00">></tspan> <tspan fill="#8b949e">shipping</tspan> Landslide-Alert</text>
<text x="40" y="206" font-size="12" fill="#d4d4d8"><tspan fill="#ff7b00">></tspan> <tspan fill="#8b949e">modding</tspan> Minecraft plugins <tspan class="cur" fill="#ff7b00">_</tspan></text>

<!-- Stat pills -->
<g transform="translate(40, 220)">
<rect class="pill" x="0" y="0" width="112" height="26" rx="13" fill="#14100d" stroke="#ff7b00" stroke-opacity=".7"/>
<text x="56" y="17.5" text-anchor="middle" font-size="11" fill="#8b949e"><tspan id="v-commits-hero" fill="#ff7b00" font-weight="700">1,284</tspan> commits</text>
</g>

<g transform="translate(168, 220)">
<rect class="pill" x="0" y="0" width="112" height="26" rx="13" fill="#14100d" stroke="#ff7b00" stroke-opacity=".7"/>
<text x="56" y="17.5" text-anchor="middle" font-size="11" fill="#8b949e"><tspan id="v-streak-hero" fill="#ff7b00" font-weight="700">14</tspan> day streak</text>
</g>

<g transform="translate(296, 220)">
<rect class="pill" x="0" y="0" width="112" height="26" rx="13" fill="#14100d" stroke="#ff7b00" stroke-opacity=".7"/>
<text x="56" y="17.5" text-anchor="middle" font-size="11" fill="#8b949e"><tspan id="v-repos-hero" fill="#ff7b00" font-weight="700">3</tspan> repos</text>
</g>

<g transform="translate(424, 220)">
<rect class="pill" x="0" y="0" width="112" height="26" rx="13" fill="#14100d" stroke="#ff7b00" stroke-opacity=".7"/>
<text x="56" y="17.5" text-anchor="middle" font-size="11" fill="#8b949e"><tspan id="v-stars-hero" fill="#ff7b00" font-weight="700">0</tspan> ⭐</text>
</g>

<!-- Equalizer bars -->
<g class="fl" style="animation-delay:0s" transform="translate(730, 38)">
<rect class="eq" x="0" y="0" width="5" height="28" rx="2" fill="#ff7b00"/>
<rect class="eq" x="10" y="0" width="5" height="28" rx="2" fill="#e879f9" style="animation-delay:-0.23s"/>
<rect class="eq" x="20" y="0" width="5" height="28" rx="2" fill="#ff7b00" style="animation-delay:-0.46s"/>
<rect class="eq" x="30" y="0" width="5" height="28" rx="2" fill="#e879f9" style="animation-delay:-0.69s"/>
<rect class="eq" x="40" y="0" width="5" height="28" rx="2" fill="#ff7b00" style="animation-delay:-0.92s"/>
<rect class="eq" x="50" y="0" width="5" height="28" rx="2" fill="#e879f9" style="animation-delay:-1.15s"/>
</g>

<!-- Floating particles -->
<circle class="fl" cx="85" cy="280" r="1.2" fill="#ff3700" style="animation-duration:5s"/>
<circle class="fl" cx="280" cy="290" r="1" fill="#ff7b00" style="animation-duration:6s;animation-delay:1s"/>
<circle class="fl" cx="480" cy="285" r="1.3" fill="#d92b00" style="animation-duration:4.6s;animation-delay:2s"/>
<circle class="fl" cx="680" cy="292" r="1.1" fill="#ff3700" style="animation-duration:5.4s;animation-delay:.6s"/>
<circle class="fl" cx="800" cy="270" r="1" fill="#ff7b00" style="animation-duration:6.4s;animation-delay:1.6s"/>
<circle class="fl" cx="220" cy="295" r=".9" fill="#ff5500" style="animation-duration:5.8s;animation-delay:2.4s"/>

<!-- Decorative sparkles -->
<g class="tw" style="animation-delay:.4s"><path transform="translate(580, 50)" d="M0 0l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffaa55"/></g>
<g class="tw" style="animation-delay:1.8s"><path transform="translate(120, 220)" d="M0 0l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#ff3700"/></g>
<g class="tw" style="animation-delay:2.9s"><path transform="translate(740, 120)" d="M0 0l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#ff7b00"/></g>

<!-- Bottom link -->
<text x="40" y="282" font-size="10" fill="#6b7280" letter-spacing=".5">github.com/FrndlyFrags</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata>
</svg>