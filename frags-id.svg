  <circle cx="34.5" cy="21" r="2" fill="#ff00ff" opacity="0.6"/>
</g>

<g class="hp" style="animation-delay:.3s" transform="translate(60,100)" filter="url(#glow2)">
  <path d="M 8 22 A 20 20 0 0 1 44 22" fill="none" stroke="#ff3700" stroke-width="3.5" stroke-linecap="round" opacity=".5"/>
  <path d="M 8 22 A 20 20 0 0 1 44 22" fill="none" stroke="#ff7b00" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <rect x="3" y="18" width="9" height="14" rx="4" fill="#ff2200" opacity=".5"/>
